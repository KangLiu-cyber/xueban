[package]
name = "application"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1", features = ["derive", "chrono04"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
