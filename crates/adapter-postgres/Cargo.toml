[package]
name = "adapter-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
argon2 = "0.5"
chrono = "0.4"
domain = { path = "../domain" }
rand = "0.8"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
