[package]
name = "adapter-mcp"
version = "0.1.2"
edition = "2024"

[dependencies]
application = { path = "../application" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
domain = { path = "../domain" }
rmcp = { version = "0.15", features = ["transport-streamable-http-server"] }
schemars = { version = "1", features = ["derive", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
