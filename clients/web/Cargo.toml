[package]
name = "web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "wasmbind"] }
console_error_panic_hook = "0.1"
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-timers = "0.3"
js-sys = "0.3"
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "DomRect",
    "Element",
    "HtmlDocument",
    "HtmlElement",
    "HtmlTextAreaElement",
    "Location",
    "Navigator",
    "Performance",
    "Range",
    "Selection",
    "Window",
] }
