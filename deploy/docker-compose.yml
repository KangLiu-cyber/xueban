# 单机部署编排（docs/architecture.md §11）：postgres + server + web 三个服务。
# 镜像不做编译——先跑 scripts/build-musl.sh（二进制）与 trunk build --release（web 产物），
# 再 build 本编排；skills/ 目录只读挂载进 server，宿主直接编辑 skills/ 即更新。
# 完整部署包由 scripts/package-server.sh 打 tar.gz，解压后即可直接 docker compose up --build。
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d --build
# 环境变量：POSTGRES_PASSWORD（生产必须改）、MCP_ENDPOINT（Agent 凭证下发的对外地址）。

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xueban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xueban-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-xueban}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xueban}:${POSTGRES_PASSWORD:-xueban-dev-password}@postgres:5432/${POSTGRES_DB:-xueban}
      BIND_ADDR: 0.0.0.0:8080
      MCP_ENDPOINT: ${MCP_ENDPOINT:-http://127.0.0.1:8080/mcp}
    volumes:
      - ../skills:/app/skills:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 前端 web：nginx 静态服务 + 同域反代 /api 与 /mcp 到 server（deploy/nginx.conf）。
  # 浏览器访问 http://<host>:8081 即可；MCP 端点对外为 http://<host>:8081/mcp。
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
