# web 容器：静态服务前端产物 + 同域反代 /api 与 /mcp 到 server 容器。
# 前端 API 基址走浏览器运行期同源兜底（location.origin + /api/v1，见 clients/web/src/api.rs），
# 同域反代后无需构建期注入 XUEBAN_API_BASE，也无需跨域。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MCP 走 streamable HTTP（SSE 流式），关缓冲、放长超时
    location /mcp {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
