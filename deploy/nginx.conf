# 学伴 Web 网关（docs/architecture.md §11）：
#   - 前端静态产物（clients/web/dist）由 nginx 直接托管，SPA 回退 index.html；
#   - /api/v1、/mcp、/healthz 反向代理到后端 server 容器（8080）；
#   - /mcp 为 MCP streamable-http（SSE 流式响应），关闭缓冲并拉长超时。
# 挂载方式：deploy/docker-compose.yml 中本文件挂载为 /etc/nginx/conf.d/default.conf，
#           前端产物挂载为 /usr/share/nginx/html。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 附件上传（后端上限 12MB），留余量
    client_max_body_size 20m;

    # 前端静态资源：优先磁盘文件，未命中回退 index.html（SPA 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反向代理
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP 网关（streamable-http / SSE）：关闭缓冲、拉长读写超时
    location /mcp {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 健康检查
    location = /healthz {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }
}
