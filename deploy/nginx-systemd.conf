# 学伴 Web 网关（systemd 部署，docs/architecture.md §11）。
# 与 deploy/nginx.conf（docker 部署）功能一致，差异仅两点：
#   1. 前端产物在宿主磁盘 /var/www/xueban（install-systemd.sh 复制）；
#   2. 反代目标为 127.0.0.1:8080（server 由 systemd 托管在宿主，非 docker 服务名）。
# 安装：scripts/install-systemd.sh 复制为 /etc/nginx/conf.d/xueban.conf 后
#       `nginx -t && systemctl reload nginx`。

server {
    listen 80;
    server_name _;

    root /var/www/xueban;
    index index.html;

    # 附件上传（后端上限 12MB），留余量
    client_max_body_size 20m;

    # 前端静态资源：优先磁盘文件，未命中回退 index.html（SPA 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP 网关（streamable-http / SSE）：关闭缓冲、拉长读写超时
    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 健康检查
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
