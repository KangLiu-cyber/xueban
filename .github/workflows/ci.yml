# CI（docs/architecture.md §11）：
#   触发：仅打固定版本 tag（v*，如 v0.1.0）触发整条流水线并发 Release；pull_request 只跑 gate 门禁；日常推分支不触发
#   gate        — 提交门禁（fmt + clippy + test + check），与本地 `make gate` 一致
#   build-musl  — cross 编译 musl 静态二进制 + trunk 编译 web 产物 → 服务端部署包
#   android     — 安卓 APK（独立安装包）
#   desktop     — 桌面端安装包（Tauri，独立安装包）
#   release     — 固定版本 tag（v*）触发的发布 job，CI 走完创建 GitHub Release（上传三个不同的包）
# 脚本统一放 scripts/（build-musl.sh / package-server.sh），本地 `make build-musl` 可复现。

name: CI

on:
  push:
    # 不打 tag 不触发 CI：只有推 v* 版本 tag（如 v0.1.0）才跑整条流水线
    tags: ['v*']
  pull_request:

jobs:
  gate:
    name: 门禁（fmt + clippy + test + check）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: 门禁
        run: make gate

  build-musl:
    name: 构建服务端部署包（cross musl + trunk web）
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 cross
        run: cargo install cross --locked
      - name: cross 交叉编译（musl 静态二进制）
        run: scripts/build-musl.sh
      - name: 安装 trunk
        run: cargo install trunk --locked
      - name: 编译前端 web 产物
        run: |
          rustup target add wasm32-unknown-unknown
          cd clients/web && trunk build --release
      - name: 打包部署包（二进制 + skills + web + deploy 编排）
        run: scripts/package-server.sh
      - name: 上传服务端部署包
        uses: actions/upload-artifact@v4
        with:
          name: xueban-server
          path: dist/*.tar.gz

  android:
    name: 构建安卓 APK
    runs-on: macos-latest
    needs: gate
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 构建 APK（debug 可安装验证，端点指向生产域名）
        run: ./gradlew :app:assembleDebug -PapiBaseUrl=https://buildstore.mjcode.top/api/v1 -q
      - name: 上传 APK（path 相对仓库根解析，working-directory 只作用于 run 步骤）
        uses: actions/upload-artifact@v4
        with:
          name: xueban-android
          if-no-files-found: error
          path: clients/android/app/build/outputs/apk/debug/*.apk

  desktop:
    name: 构建桌面端安装包
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装系统依赖（Tauri）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 安装 trunk
        run: cargo install trunk --locked
      - name: 安装 tauri CLI（crate 名 tauri-cli，安装的 binary 是 cargo-tauri）
        run: cargo install tauri-cli --locked
      - name: 编译桌面端安装包（tauri 自动先 trunk build 前端，tauri build 默认即 release，端点指向生产域名）
        run: |
          rustup target add wasm32-unknown-unknown
          cd clients/desktop && XUEBAN_API_BASE=https://buildstore.mjcode.top/api/v1 cargo tauri build
      - name: 上传安装包（clients/ 是独立 workspace，cargo 产物在 clients/target 下）
        uses: actions/upload-artifact@v4
        with:
          name: xueban-desktop
          if-no-files-found: error
          path: |
            clients/target/release/bundle/deb/*.deb
            clients/target/release/bundle/appimage/*.AppImage

  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-musl, android, desktop]
    # 只对固定版本 tag（v*，如 v0.1.0）触发，push tag 即发布；日常推 main 不发
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 创建 Release（用所打的 tag，上传三个不同的包）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # 不用 glob（避免 shell 匹配不到时失败），find 收集全部交付物后显式传给 gh
          mapfile -t files < <(find dist -type f \( -name '*.tar.gz' -o -name '*.apk' -o -name '*.deb' -o -name '*.AppImage' \))
          if [ "${#files[@]}" -lt 3 ]; then
            echo "交付物不齐（共 ${#files[@]} 个）：${files[*]}"
            exit 1
          fi
          gh release create "$tag" "${files[@]}" \
            --title "xueban ${tag}" \
            --notes "CI 自动发布，含三个独立的包：服务端部署包（tar.gz，docker 部署源）、安卓 APK、桌面端安装包"
